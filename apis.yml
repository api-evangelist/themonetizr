aid: themonetizr
name: TheMonetizr
description: >-
  Monetizr (TheMonetizr) is a gaming media platform for in-game brand advertising that turns
  gameplay into measurable, voluntary, and non-skippable brand engagement. Brands run branded
  campaigns and missions inside mobile games; players complete them for in-game or brand-sponsored
  rewards, reporting >30% average engagement, >90% viewability, and >85% video completion across a
  340M mobile-gamer reach. The Monetizr Campaigns API (base https://api.themonetizr.com) serves
  active campaigns to games — listing campaigns/missions, resetting progress, and claiming rewards —
  and is consumed by the official open-source Unity SDK using a per-game HTTP Bearer API key. The
  company is a Techstars-backed portfolio company.
